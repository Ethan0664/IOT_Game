<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物聯網與雲端架構 RPG 闖關學習系統</title>
<style>
  :root {
    --bg-main: #0b1120;
    --bg-surface: #1e293b;
    --bg-elevated: #334155;
    --primary: #38bdf8;
    --primary-dark: #0284c7;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --hell-red: #f43f5e;
    --hell-bg: rgba(136, 19, 55, 0.22);
    --text-light: #f8fafc;
    --text-dim: #94a3b8;
    --border-color: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-light);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-color);
    padding: 12px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand-btn {
    background: transparent;
    border: none;
    color: var(--primary);
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-btn:hover { opacity: 0.85; }

  .rpg-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-mini {
    width: 75px;
    height: 8px;
    background: #1e293b;
    border-radius: 4px;
    overflow: hidden;
  }
  .fill-exp { height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); transition: width 0.3s; }
  .fill-hp { height: 100%; background: linear-gradient(90deg, #ef4444, #fb7185); transition: width 0.3s; }

  .btn {
    background: var(--bg-elevated);
    color: var(--text-light);
    border: 1px solid #475569;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover {
    background: var(--primary-dark);
    border-color: var(--primary);
    transform: translateY(-1px);
  }
  .btn-primary {
    background: var(--primary);
    color: #0b1120;
    border-color: var(--primary);
    font-weight: 700;
  }
  .btn-primary:hover {
    background: #7dd3fc;
    color: #0b1120;
  }
  .btn-success {
    background: var(--success);
    color: #052e16;
    border-color: var(--success);
    font-weight: 700;
  }
  .btn-hell {
    background: linear-gradient(135deg, #e11d48, #be123c);
    color: #fff;
    border-color: #fb7185;
    font-weight: 700;
  }
  .btn-hell:hover {
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    border-color: #fda4af;
  }

  .main-container {
    max-width: 1040px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 20px 64px;
    flex: 1;
  }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-color);
  }
  .view-heading h1 {
    font-size: 1.65rem;
    margin-bottom: 6px;
  }
  .view-heading p {
    color: var(--text-dim);
    font-size: 0.95rem;
  }

  .world-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .world-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 18px;
    transition: all 0.22s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .world-card:hover {
    border-color: var(--primary);
    transform: translateY(-4px);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
  }
  .world-card.locked-file {
    opacity: 0.7;
    cursor: default;
  }
  .world-badge {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--primary);
    background: rgba(56, 189, 248, 0.12);
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .hell-cleared-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fda4af;
    background: rgba(225, 29, 72, 0.25);
    border: 1px solid rgba(244, 63, 94, 0.5);
    padding: 3px 8px;
    border-radius: 6px;
    margin-left: 6px;
  }
  .world-card h2 {
    font-size: 1.22rem;
    line-height: 1.4;
  }
  .world-progress-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .world-progress-bar {
    width: 100%;
    height: 10px;
    background: var(--bg-main);
    border-radius: 5px;
    overflow: hidden;
  }
  .world-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    transition: width 0.3s ease;
  }
  .world-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 18px;
  }
  .level-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 16px;
    transition: 0.2s;
  }
  .level-card:hover {
    border-color: var(--primary);
  }
  .level-card.passed {
    border-color: rgba(34, 197, 94, 0.6);
    background: linear-gradient(180deg, rgba(34, 197, 94, 0.06) 0%, var(--bg-surface) 100%);
  }
  .level-card.hell-card {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(136, 19, 55, 0.32) 0%, rgba(30, 41, 59, 0.95) 100%);
    border: 2px solid var(--hell-red);
    box-shadow: 0 0 25px rgba(244, 63, 94, 0.15);
  }
  .level-card.hell-card.passed {
    border-color: #f59e0b;
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.18) 0%, rgba(30, 41, 59, 0.95) 100%);
  }
  .level-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .level-num {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--bg-main);
    padding: 4px 10px;
    border-radius: 6px;
  }
  .hell-num {
    font-size: 0.82rem;
    font-weight: 800;
    color: #fecdd3;
    background: rgba(225, 29, 72, 0.35);
    border: 1px solid rgba(251, 113, 133, 0.5);
    padding: 4px 12px;
    border-radius: 6px;
  }
  .pass-pill {
    font-size: 0.8rem;
    font-weight: 700;
    color: #4ade80;
    background: rgba(34, 197, 94, 0.15);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .level-card h3 {
    font-size: 1.12rem;
    line-height: 1.45;
    margin-top: 8px;
  }
  .boss-info {
    font-size: 0.85rem;
    color: var(--warning);
    background: rgba(245, 158, 11, 0.1);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(245, 158, 11, 0.25);
  }
  .boss-info.hell-boss {
    color: #fda4af;
    background: rgba(225, 29, 72, 0.15);
    border-color: rgba(244, 63, 94, 0.4);
  }
  .level-actions {
    display: flex;
    gap: 10px;
  }
  .level-actions .btn {
    flex: 1;
    justify-content: center;
  }

  .stage-box {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 24px;
  }
  .step-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-color);
  }
  .step-dots {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .step-dot {
    padding: 6px 12px;
    border-radius: 6px;
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    color: var(--text-dim);
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 600;
  }
  .step-dot.active {
    background: var(--primary);
    color: #0b1120;
    border-color: var(--primary);
  }
  .point-title {
    color: var(--primary);
    font-size: 1.2rem;
    margin-bottom: 12px;
  }
  .point-detail {
    font-size: 1rem;
    line-height: 1.8;
    color: #e2e8f0;
    white-space: pre-line;
  }
  .step-Bottom-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed var(--border-color);
  }

  .comp-section {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .comp-section h3 {
    color: var(--warning);
    font-size: 1.12rem;
    margin-bottom: 14px;
  }
  table.comp-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }
  table.comp-table th, table.comp-table td {
    border: 1px solid var(--border-color);
    padding: 12px 14px;
    text-align: left;
    vertical-align: top;
    line-height: 1.55;
  }
  table.comp-table th {
    background: rgba(56, 189, 248, 0.14);
    color: var(--primary);
    font-weight: 700;
  }
  table.comp-table tr:nth-child(even) td {
    background: rgba(15, 23, 42, 0.4);
  }

  .quiz-progress-header {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(245, 158, 11, 0.15));
    border: 1px solid rgba(245, 158, 11, 0.4);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .quiz-progress-header.hell-banner {
    background: linear-gradient(135deg, rgba(159, 18, 57, 0.45), rgba(15, 23, 42, 0.95));
    border: 2px solid var(--hell-red);
  }
  .quiz-question-text {
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.65;
    margin-bottom: 18px;
  }
  .opt-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .opt-item {
    text-align: left;
    background: var(--bg-main);
    color: var(--text-light);
    border: 1px solid var(--border-color);
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 0.95rem;
    line-height: 1.6;
    cursor: pointer;
    transition: 0.15s;
  }
  .opt-item:hover:not(:disabled) {
    border-color: var(--primary);
    background: rgba(56, 189, 248, 0.08);
  }
  .opt-item.correct {
    background: rgba(34, 197, 94, 0.2);
    border-color: var(--success);
    color: #bbf7d0;
    font-weight: 600;
  }
  .opt-item.wrong {
    background: rgba(239, 68, 68, 0.2);
    border-color: var(--danger);
    color: #fecaca;
  }
  .exp-panel {
    margin-top: 18px;
    padding: 16px 20px;
    background: rgba(15, 23, 42, 0.85);
    border-left: 4px solid var(--warning);
    border-radius: 8px;
    line-height: 1.65;
    font-size: 0.94rem;
    color: #e2e8f0;
  }

  .cta-banner {
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid var(--primary);
    border-radius: 14px;
    padding: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 24px;
  }
</style>
</head>
<body>

<header>
  <button class="brand-btn" onclick="goWorldMap()" title="點擊返回七大領域入口大廳">
    <span>🛡️ IoT & Cloud 闖關學習大廳</span>
  </button>
  <div class="rpg-bar">
    <div class="stat-pill">
      <strong id="playerTitle" style="color:var(--primary)">實習工程師</strong>
      <span>LV.<span id="playerLv">1</span></span>
    </div>
    <div class="stat-pill">
      <span>EXP</span>
      <div class="progress-mini"><div id="expBar" class="fill-exp" style="width:0%"></div></div>
      <span id="expText">0/100</span>
    </div>
    <div class="stat-pill">
      <span>❤️ HP</span>
      <div class="progress-mini"><div id="hpBar" class="fill-hp" style="width:100%"></div></div>
      <span id="hpText">100</span>
      <button class="btn" onclick="healHp()" style="padding:2px 8px;font-size:0.75rem;">補血</button>
    </div>
    <button class="btn" onclick="goWrongBook()">📕 錯題本 (<span id="wrongCount">0</span>)</button>
    <button class="btn" onclick="resetProgress()" style="padding:6px 10px;font-size:0.8rem;">🔄 重置</button>
  </div>
</header>

<div class="main-container" id="appRoot"></div>

<!-- 內建 Week 1 與 Week 2 一般關卡 + 嚴格教授級地獄模式（無括號提示、高誘答選項） -->
<script>
window.IOT_GAME_DATA = [
  {
    worldId: "week1",
    worldTitle: "第一大塊：Week 1 物聯網導論",
    worldDesc: "從實體世界到數位世界、S-N-D-A 四要素、五環節架構、Edge+Cloud 分工與資料價值四階段",
    levels: [
      {
        id: "w1-1",
        title: "1-1 實體與數位世界的橋樑（SNDA 與五環節架構）",
        bossName: "感知迷霧守衛",
        expReward: 50,
        points: [
          {
            title: "我們到底在「連」什麼？實體世界 (Physical World) vs. 數位世界 (Digital World)",
            detail: "1. 看得見的實體世界狀態：包含「機器」（震動、溫度）、「車輛」（位置、速度）、「居家」（門窗、電器）、「環境」（空氣、濕度）。\n2. 系統可處理的數位世界：透過「感知 → 資料 → 應用」的轉換流程運作。\n3. IoT 的核心關鍵：不是「把世界變成資料」，而是讓實體世界原本就存在的狀態「被感知」，並帶進數位系統中形成可被系統處理的數位資料。"
          },
          {
            title: "IoT 的四大核心要素 (S-N-D-A)",
            detail: "• S (Sensor 感測)：取得溫度、震動、位置、影像等實體世界狀態。\n• N (Network 連線)：讓前端裝置與後端平台、系統之間交換資訊。\n• D (Data 資料)：把收集到的實體狀態正規化，形成可處理的數位資料。\n• A (Application 應用)：進行即時監控、深度分析、趨勢預測與自動化控制。"
          },
          {
            title: "一個完整的 IoT 系統五環節：「買了感測器 ≠ 完成 IoT」",
            detail: "完整的物聯網系統必須串聯五個環節，價值來自五者的整合：\n01. Device（裝置）：感知實體狀態（搭配 Actuators 致動器改變實體狀態）。\n02. Connectivity（連線）：傳遞資訊至運算端。\n03. Compute（運算）：邊緣或雲端的資料處理與整合。\n04. Data（資料）：結構化/時序化儲存與分析。\n05. Application（應用）：最終產生商業與管理價值。"
          },
          {
            title: "從「感知」到「行動」的五步驟閉迴路",
            detail: "1. 感知 (Sensor) → 2. 傳輸 (Network) → 3. 處理 (Edge / Cloud) → 4. 分析 (Data / AI) → 5. 行動 (Application)。\n核心原則：重點從來不是「手上有沒有資料」，而是「資料能不能支持決策與行動」。"
          }
        ],
        comparisons: [
          {
            title: "實體世界 vs. 數位世界 & 單買硬體 vs. 完整 IoT 系統比較",
            headers: ["比較維度", "傳統孤立感測器 / 實體狀態", "完整五環節 IoT 數位系統"],
            rows: [
              ["資料狀態", "物理現象（機器震動、環境溫濕度）散落現場，未被記錄或僅限本地錶頭顯示", "透過 Sensor 轉為數位 Data，經 Network 匯聚至 Edge/Cloud 進行整合"],
              ["系統邊界", "買了感測器僅完成 01 Device 環節，形成資訊孤島", "完整涵蓋 Device → Connectivity → Compute → Data → Application"],
              ["最終產出", "僅有原始讀數，仰賴人工抄表與經驗判斷", "將資料轉化為自動化決策與閉迴路行動 (Action)"]
            ]
          }
        ],
        quizzes: [
          {
            q: "【觀念比較】關於物聯網（IoT）連接實體世界與數位世界的本質，下列敘述何者最正確？",
            options: [
              "A. 只要企業採購並安裝了大量高精度的溫濕度與震動感測器，就算完成了完整的 IoT 系統建置",
              "B. IoT 的本質是憑空創造數據，且所有資料只要成功連上網傳回資料庫就達到 IoT 的終極目標",
              "C. IoT 是把實體世界原本存在的狀態（震動、位置、溫濕度）透過感知帶進數位系統，並經由「感知→傳輸→處理→分析→行動」支持決策",
              "D. 在 S-N-D-A 架構中，Compute（運算）與 Application（應用）屬於傳統 IT 範疇，不屬於 IoT 系統五環節的一部分"
            ],
            ans: 2,
            exp: "解析：「買了感測器 ≠ 完成 IoT」，IoT 系統必須整合 Device、Connectivity、Compute、Data、Application 五大環節；且重點不是只有資料，而是能否支持決策與行動 (Action)。"
          },
          {
            q: "【架構對照】在 IoT 從「感知」走向「行動」的五個步驟中，哪一個環節直接負責接收 Network 傳來的資訊並進行「處理與整合」，再交由 Data / AI 進行分析？",
            options: [
              "A. Sensor（前端感測層）",
              "B. Edge / Cloud（邊緣與雲端運算層 Compute）",
              "C. Physical World（實體機器與居家環境）",
              "D. 單純的藍牙或 Wi-Fi 路由器硬體"
            ],
            ans: 1,
            exp: "解析：五步驟依序為：1.感知 (Sensor) → 2.傳輸 (Network) → 3.處理 (Edge / Cloud，對應五環節的 Compute) → 4.分析 (Data / AI) → 5.行動 (Application)。"
          }
        ]
      },
      {
        id: "w1-2",
        title: "1-2 為什麼 IoT 需要雲端？雲邊協同（Edge + Cloud）",
        bossName: "雙界架構審判官",
        expReward: 60,
        points: [

          {

              "A. Propagation Delay 是指封包在路由器排隊等待的時間，Transmission Delay 是指光訊號在光纖介質中的傳播時間，兩者皆隨實體距離增加而拉長",

            ],
            ans: 1,
            exp: "解析：簡報第 314 至 320 頁：Propagation Delay 為介質中的傳播時間、Transmission Delay 為封包送出的時間、Queueing Delay 為路由器排隊；高畫質影像上傳吃掉上行頻寬且資料出站（Egress）會產生成本屬於 Economic 限制；基地台切換、光纖故障、DNS 中斷與 Offline Autonomy 屬於 Availability 限制。"
          }

];

<script>
  const EXPECTED_WORLDS = [
    { worldId: "week1", badge: "WEEK 1", worldTitle: "物聯網導論", desc: "實體與數位世界、S-N-D-A、五環節架構、Edge+Cloud 協同與資料價值四階段", fileHint: "內建於 index.html" },
    { worldId: "week2", badge: "WEEK 2", worldTitle: "雲端運算與物聯網架構演進", desc: "裸機瓶頸、伺服器虛擬化、NIST 五大特徵、IaC/GitOps、時序資料與純雲端四大限制", fileHint: "內建於 index.html" },
    { worldId: "week3", badge: "WEEK 3", worldTitle: "雲端運算對商業與產業影響", desc: "IT 成本冰山、TCO 曲線、SLI/SLO/SLA、FinOps、四大產業轉型、零信任與逆向出雲", fileHint: "需載入 data_week3_4.js" },
    { worldId: "week4", badge: "WEEK 4", worldTitle: "IaaS 基礎架構服務模式", desc: "傳統代管 vs. 雲端 IaaS、虛擬化三大損耗、CaaS 超配、Block/File/Object 儲存與 SDN/VXLAN", fileHint: "需載入 data_week3_4.js" },
    { worldId: "week5", badge: "WEEK 5", worldTitle: "PaaS 平台即服務模式", desc: "PaaS 抽象層、無狀態設計、DBaaS、快取三大災難、FaaS 與 MicroVM、藍綠/金絲雀部署與 IoT PaaS", fileHint: "需載入 data_week5_6_review.js" },
    { worldId: "week6", badge: "WEEK 6", worldTitle: "SaaS 模式 × IoT 平台 × 邊緣運算", desc: "單租戶 vs. 多租戶、資料庫隔離、權杖桶 vs. 漏桶、IoT SaaS、容器 vs. VM、K3s 與 EdgeX Foundry", fileHint: "需載入 data_week5_6_review.js" },
    { worldId: "week7", badge: "FINAL REVIEW", worldTitle: "跨週次架構終極總複習", desc: "整合 Week 1 至 Week 6 所有服務模式、資料庫、網路協定與雲邊協同架構之綜合對決", fileHint: "需載入 data_week5_6_review.js" }
  ];

  const STORAGE_KEY = "IOT_RPG_SAVE_V1";
  let playerState = {
    lv: 1,
    exp: 0,
    hp: 100,
    passedLevels: {},
    wrongQuestions: []
  };

  let currentView = "worldMap";
  let selectedWorldId = "week1";
  let currentLevelId = "w1-1";
  let currentPointIndex = 0;
  let showAllPoints = false;
  let currentQuizState = {};

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) playerState = Object.assign(playerState, JSON.parse(saved));
    } catch (e) {
      console.warn(e);
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(playerState));
    } catch (e) {
      console.warn(e);
    }
    updateHeaderUI();
  }

  function getTitleByLv(lv) {
    if (lv >= 18) return "🔥 煉獄端邊雲神級宗師";
    if (lv >= 12) return "👑 首席端邊雲架構宗師";
    if (lv >= 8) return "🌟 資深雲原生架構師";
    if (lv >= 5) return "⚡ 雲端物聯網工程師";
    if (lv >= 3) return "🔧 初階系統工程師";
    return "🌱 實習物聯網工程師";
  }

  function addExp(amount) {
    playerState.exp += amount;
    while (playerState.exp >= playerState.lv * 100) {
      playerState.exp -= playerState.lv * 100;
      playerState.lv += 1;
      playerState.hp = 100;
    }
    saveState();
  }

  function healHp() {
    playerState.hp = 100;
    saveState();
  }

  function resetProgress() {
    if (confirm("確定要重置所有等級、綠色通關勳章、地獄模式制霸紀錄與錯題本嗎？")) {
      playerState = { lv: 1, exp: 0, hp: 100, passedLevels: {}, wrongQuestions: [] };
      currentQuizState = {};
      saveState();
      renderApp();
    }
  }

  function updateHeaderUI() {
    const needExp = playerState.lv * 100;
    document.getElementById("playerTitle").textContent = getTitleByLv(playerState.lv);
    document.getElementById("playerLv").textContent = playerState.lv;
    document.getElementById("expText").textContent = `${playerState.exp}/${needExp}`;
    document.getElementById("expBar").style.width = `${Math.min(100, (playerState.exp / needExp) * 100)}%`;
    document.getElementById("hpText").textContent = `${playerState.hp}`;
    document.getElementById("hpBar").style.width = `${Math.max(0, playerState.hp)}%`;
    document.getElementById("wrongCount").textContent = playerState.wrongQuestions.length;
  }

  function findWorldData(worldId) {
    return window.IOT_GAME_DATA.find(w => w.worldId === worldId);
  }

  function findLevelById(levelId) {
    for (const world of window.IOT_GAME_DATA) {
      for (const lv of world.levels) {
        if (lv.id === levelId) return { world, level: lv };
      }
    }
    return { world: window.IOT_GAME_DATA[0], level: window.IOT_GAME_DATA[0].levels[0] };
  }

  function goWorldMap() {
    currentView = "worldMap";
    window.scrollTo(0, 0);
    renderApp();
  }

  function goLevelMap(worldId) {
    const loaded = findWorldData(worldId);
    if (!loaded || !loaded.levels || loaded.levels.length === 0) {
      alert("此大關的題庫檔案尚未載入，請確認對應 .js 檔已放入同一資料夾！");
      return;
    }
    selectedWorldId = worldId;
    currentView = "levelMap";
    window.scrollTo(0, 0);
    renderApp();
  }

  function goStageStudy(levelId) {
    const found = findLevelById(levelId);
    selectedWorldId = found.world.worldId;
    currentLevelId = levelId;
    currentPointIndex = 0;
    currentView = "stageStudy";
    window.scrollTo(0, 0);
    renderApp();
  }

  function goStageQuiz(levelId) {
    const found = findLevelById(levelId);
    selectedWorldId = found.world.worldId;
    currentLevelId = levelId;
    currentView = "stageQuiz";
    window.scrollTo(0, 0);
    renderApp();
  }

  function goWrongBook() {
    currentView = "wrongBook";
    window.scrollTo(0, 0);
    renderApp();
  }

  function renderApp() {
    const root = document.getElementById("appRoot");
    if (currentView === "worldMap") {
      renderWorldMap(root);
    } else if (currentView === "levelMap") {
      renderLevelMap(root);
    } else if (currentView === "stageStudy") {
      renderStageStudy(root);
    } else if (currentView === "stageQuiz") {
      renderStageQuiz(root);
    } else if (currentView === "wrongBook") {
      renderWrongBook(root);
    }
  }

  function renderWorldMap(container) {
    let totalPassed = Object.keys(playerState.passedLevels).length;
    let html = `
      <div class="nav-bar">
        <div class="view-heading">
          <h1>🗺️ 七大領域學習大廳（含每大關 10 題 🔥 地獄模式試煉）</h1>
          <p>點擊任一大關卡片進入小關卡選擇地圖；每大關底部皆附有高鑑別度「🔥 地獄模式（10 題無提示深度試煉）」</p>
        </div>
        <div class="stat-pill" style="font-size:0.95rem;padding:8px 16px;">
          <span>🏆 總通關數：<strong style="color:var(--success)">${totalPassed}</strong> 關</span>
        </div>
      </div>
      <div class="world-grid">
    `;

    EXPECTED_WORLDS.forEach(exp => {
      const loaded = findWorldData(exp.worldId);
      const isReady = loaded && loaded.levels && loaded.levels.length > 0;
      const totalLv = isReady ? loaded.levels.length : 0;
      const passedLv = isReady ? loaded.levels.filter(l => playerState.passedLevels[l.id]).length : 0;
      const pct = totalLv > 0 ? Math.round((passedLv / totalLv) * 100) : 0;
      const hellLv = isReady ? loaded.levels.find(l => l.isHell) : null;
      const hellCleared = hellLv && playerState.passedLevels[hellLv.id];

      html += `
        <div class="world-card ${isReady ? "" : "locked-file"}" onclick="${isReady ? `goLevelMap('${exp.worldId}')` : ""}">
          <div>
            <div>
              <span class="world-badge">${exp.badge}</span>
              ${hellCleared ? `<span class="hell-cleared-tag">🔥 地獄制霸</span>` : (hellLv ? `<span class="hell-cleared-tag" style="opacity:0.75">🔥 含地獄 10 題</span>` : ``)}
            </div>
            <h2>${exp.worldTitle}</h2>
            <p style="color:var(--text-dim);font-size:0.88rem;margin-top:8px;line-height:1.55;">
              ${exp.desc}
            </p>
          </div>
          <div class="world-progress-wrap">
            ${isReady ? `
              <div class="world-progress-bar">
                <div class="world-progress-fill" style="width:${pct}%"></div>
              </div>
              <div class="world-meta">
                <span>已通關：${passedLv} / ${totalLv} 關</span>
                <span style="color:var(--primary);font-weight:700;">進入大關 ➔</span>
              </div>
            ` : `
              <div class="world-meta" style="color:var(--warning);">
                <span>⏳ 待放入題庫檔（${exp.fileHint}）</span>
              </div>
            `}
          </div>
        </div>
      `;
    });

    html += `</div>`;
    container.innerHTML = html;
  }

  function renderLevelMap(container) {
    const world = findWorldData(selectedWorldId);

    let html = `
      <div class="nav-bar">
        <div class="view-heading">
          <div style="margin-bottom:8px;">
            <button class="btn" onclick="goWorldMap()">⬅ 返回七大領域入口大廳</button>
          </div>
          <h1>${world.worldTitle}</h1>
          <p>一般小關卡可逐步學習知識點與比較表；底部的「🔥 地獄模式」模擬刁鑽考題（無括號提示、高誘答性）</p>
        </div>
      </div>
      <div class="level-grid">
    `;

    world.levels.forEach((lv, idx) => {
      const isPassed = !!playerState.passedLevels[lv.id];
      const isHell = !!lv.isHell;

      if (isHell) {
        html += `
          <div class="level-card hell-card ${isPassed ? "passed" : ""}">
            <div>
              <div class="level-top">
                <span class="hell-num">🔥 HELL MODE 期中實戰級試煉（共 ${lv.quizzes.length} 題無提示深度測驗）</span>
                ${isPassed ? `<span class="pass-pill">🔥 地獄已制霸</span>` : ``}
              </div>
              <h3 style="color:#fecdd3;font-size:1.22rem;">${lv.title}</h3>
              <p style="color:#cbd5e1;font-size:0.9rem;margin-top:6px;">
                移除所有選項括號提示，專考簡報易混淆架構邊界與細節對調（答錯每題扣 25 HP）！
              </p>
            </div>
            <div class="boss-info hell-boss">
              👹 煉獄守關 Boss：<strong>${lv.bossName}</strong>（全對通關獎勵 +${lv.expReward} EXP）
            </div>
            <div class="level-actions">
              <button class="btn btn-hell" onclick="goStageQuiz('${lv.id}')">🔥 立即挑戰 10 題地獄模式試煉 ➔</button>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="level-card ${isPassed ? "passed" : ""}">
            <div>
              <div class="level-top">
                <span class="level-num">STAGE ${idx + 1}（共 ${lv.points.length} 個知識點 / ${lv.quizzes.length} 題測驗）</span>
                ${isPassed ? `<span class="pass-pill">✅ 已通關</span>` : ``}
              </div>
              <h3>${lv.title}</h3>
            </div>
            <div class="boss-info">
              👾 守關 Boss：<strong>${lv.bossName}</strong>（通關獎勵 +${lv.expReward} EXP）
            </div>
            <div class="level-actions">
              <button class="btn btn-primary" onclick="goStageStudy('${lv.id}')">📘 進入知識講解</button>
              <button class="btn" onclick="goStageQuiz('${lv.id}')">⚔️ 直接測驗</button>
            </div>
          </div>
        `;
      }
    });

    html += `</div>`;
    container.innerHTML = html;
  }

  function renderStageStudy(container) {
    const { world, level } = findLevelById(currentLevelId);
    const isPassed = !!playerState.passedLevels[level.id];
    const totalPts = level.points.length;

    let html = `
      <div class="nav-bar">
        <div class="view-heading">
          <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
            <button class="btn" onclick="goWorldMap()">🏠 七大領域大廳</button>
            <button class="btn" onclick="goLevelMap('${world.worldId}')">⬅ 返回「${world.worldTitle}」關卡列表</button>
          </div>
          <h1>📘 ${level.title} ${isPassed ? "✅" : ""}</h1>
          <p>先閱讀本關核心知識點與架構比較表，準備好後點擊下方按鈕挑戰本關獨立測驗</p>
        </div>
        <button class="btn btn-primary" onclick="goStageQuiz('${level.id}')">⚔️ 切換至本關 Boss 測驗 ➔</button>
      </div>

      <div class="stage-box">
        <div class="step-controls">
          <div class="step-dots">
            ${level.points.map((pt, i) => `
              <button class="step-dot ${!showAllPoints && i === currentPointIndex ? "active" : ""}" onclick="selectPoint(${i})">
                知識點 ${i + 1}
              </button>
            `).join("")}
          </div>
          <button class="btn" onclick="toggleShowAllPoints()">
            ${showAllPoints ? "📑 切換為「逐張卡片聚焦閱讀」" : "📖 展開本關全部知識點"}
          </button>
        </div>
    `;

    if (showAllPoints) {
      level.points.forEach((pt, i) => {
        html += `
          <div style="margin-bottom:${i < totalPts - 1 ? "24px" : "0"};padding-bottom:${i < totalPts - 1 ? "20px" : "0"};border-bottom:${i < totalPts - 1 ? "1px solid var(--border-color)" : "none"};">
            <h3 class="point-title">📌 核心知識點 ${i + 1}：${pt.title}</h3>
            <div class="point-detail">${pt.detail}</div>
          </div>
        `;
      });
    } else {
      const pt = level.points[currentPointIndex];
      html += `
        <div>
          <h3 class="point-title">📌 核心知識點 ${currentPointIndex + 1} / ${totalPts}：${pt.title}</h3>
          <div class="point-detail">${pt.detail}</div>
        </div>
        <div class="step-Bottom-nav">
          <button class="btn" ${currentPointIndex === 0 ? "disabled style='opacity:0.4;cursor:default'" : ""} onclick="selectPoint(${currentPointIndex - 1})">
            ⬅ 上一個知識點
          </button>
          <span style="color:var(--text-dim);font-size:0.9rem;">進度：${currentPointIndex + 1} / ${totalPts}</span>
          ${currentPointIndex < totalPts - 1 ? `
            <button class="btn btn-primary" onclick="selectPoint(${currentPointIndex + 1})">
              下一個知識點 ➔
            </button>
          ` : `
            <button class="btn btn-success" onclick="goStageQuiz('${level.id}')">
              ⚔️ 讀完最後一點，開始本關測驗 ➔
            </button>
          `}
        </div>
      `;
    }

    html += `</div>`;

    if (level.comparisons && level.comparisons.length > 0) {
      level.comparisons.forEach(comp => {
        html += `
          <div class="comp-section">
            <h3>⚖️ ${comp.title}</h3>
            <table class="comp-table">
              <thead>
                <tr>${comp.headers.map(h => `<th>${h}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${comp.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("")}
              </tbody>
            </table>
          </div>
        `;
      });
    }

    html += `
      <div class="cta-banner">
        <div>
          <h3 style="margin-bottom:4px;">準備好檢驗本關觀念了嗎？</h3>
          <p style="color:var(--text-dim);font-size:0.9rem;">擊敗守關 Boss「${level.bossName}」即可點亮本關綠色通關勳章並獲得 +${level.expReward} EXP！</p>
        </div>
        <button class="btn btn-primary" style="padding:12px 24px;font-size:1rem;" onclick="goStageQuiz('${level.id}')">
          ⚔️ 進入本關 Boss 比較測驗 ➔
        </button>
      </div>
    `;

    container.innerHTML = html;
  }

  function selectPoint(idx) {
    showAllPoints = false;
    currentPointIndex = idx;
    renderApp();
  }

  function toggleShowAllPoints() {
    showAllPoints = !showAllPoints;
    renderApp();
  }

  function renderStageQuiz(container) {
    const { world, level } = findLevelById(currentLevelId);
    if (!currentQuizState[level.id]) currentQuizState[level.id] = {};
    const answeredMap = currentQuizState[level.id];
    const isPassed = !!playerState.passedLevels[level.id];
    const isHell = !!level.isHell;

    const worldLevels = world.levels;
    const currIdx = worldLevels.findIndex(l => l.id === level.id);
    const nextLevelInWorld = currIdx >= 0 && currIdx + 1 < worldLevels.length ? worldLevels[currIdx + 1] : null;

    let correctCount = 0;
    level.quizzes.forEach((qz, i) => {
      if (answeredMap[i] === qz.ans) correctCount++;
    });

    let html = `
      <div class="nav-bar">
        <div class="view-heading">
          <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
            <button class="btn" onclick="goLevelMap('${world.worldId}')">⬅ 返回「${world.worldTitle}」關卡列表</button>
            ${!isHell ? `<button class="btn" onclick="goStageStudy('${level.id}')">📘 返回本關知識卷軸與比較表</button>` : ``}
          </div>
          <h1>${isHell ? "🔥" : "⚔️"} ${level.title}</h1>
        </div>
        <button class="btn" onclick="resetLevelQuiz('${level.id}')">🔄 重新作答本關</button>
      </div>

      <div class="quiz-progress-header ${isHell ? "hell-banner" : ""}">
        <div>
          <strong style="font-size:1.08rem;color:${isHell ? "#fda4af" : "inherit"};">
            ${isHell ? "👹 煉獄守關 Boss：" : "👾 守關 Boss："}${level.bossName}
          </strong>
          <p style="font-size:0.88rem;color:#cbd5e1;margin-top:4px;">
            ${isHell
              ? `本關共 ${level.quizzes.length} 道無提示期中實戰題（目前答對 ${correctCount} / ${level.quizzes.length} 題，答錯扣 25 HP）。全數答對即可獲得「🔥 地獄制霸」勳章！`
              : `本關共 ${level.quizzes.length} 題架構比較題（目前答對 ${correctCount} / ${level.quizzes.length} 題）。全部答對即可獲得本關「✅ 綠色通關勳章」！`}
          </p>
        </div>
        <div>
          ${isPassed ? `<span class="pass-pill" style="font-size:0.95rem;padding:8px 16px;">🎉 本關已順利制霸！</span>` : ``}
        </div>
      </div>
    `;

    level.quizzes.forEach((qz, qIdx) => {
      const userChoice = answeredMap[qIdx];
      const hasAnswered = userChoice !== undefined;

      html += `
        <div class="stage-box" style="${isHell ? "border-color:rgba(244, 63, 94, 0.35);" : ""}">
          <div class="quiz-question-text">Q${qIdx + 1}. ${qz.q}</div>
          <div class="opt-stack">
            ${qz.options.map((opt, oIdx) => {
              let cls = "opt-item";
              if (hasAnswered) {
                if (oIdx === qz.ans) cls += " correct";
                else if (oIdx === userChoice) cls += " wrong";
              }
              return `
                <button class="${cls}" ${hasAnswered ? "disabled" : ""} onclick="submitAnswer('${level.id}', ${qIdx}, ${oIdx})">
                  ${opt}
                </button>
              `;
            }).join("")}
          </div>
          ${hasAnswered ? `
            <div class="exp-panel">
              <strong>💡 詳解與比較剖析：</strong><br>${qz.exp}
            </div>
          ` : ``}
        </div>
      `;
    });

    html += `
      <div class="cta-banner">
        <button class="btn" onclick="goLevelMap('${world.worldId}')">
          ⬅ 返回「${world.worldTitle}」關卡列表
        </button>
        ${nextLevelInWorld ? `
          <button class="${nextLevelInWorld.isHell ? "btn btn-hell" : "btn btn-primary"}" onclick="${nextLevelInWorld.isHell ? `goStageQuiz('${nextLevelInWorld.id}')` : `goStageStudy('${nextLevelInWorld.id}')`}">
            前往下一關：${nextLevelInWorld.title} ➔
          </button>
        ` : `
          <button class="btn btn-success" onclick="goWorldMap()">
            🎉 本週大關全數完成！返回七大領域大廳 ➔
          </button>
        `}
      </div>
    `;

    container.innerHTML = html;
  }

  function submitAnswer(levelId, qIdx, choiceIdx) {
    const { level } = findLevelById(levelId);
    const quiz = level.quizzes[qIdx];
    if (!currentQuizState[levelId]) currentQuizState[levelId] = {};
    currentQuizState[levelId][qIdx] = choiceIdx;

    const scrollPos = window.scrollY;

    if (choiceIdx === quiz.ans) {
      addExp(level.isHell ? 30 : 20);
    } else {
      const dmg = level.isHell ? 25 : 15;
      playerState.hp = Math.max(0, playerState.hp - dmg);
      const wrongKey = `${levelId}_Q${qIdx}`;
      if (!playerState.wrongQuestions.some(w => w.key === wrongKey)) {
        playerState.wrongQuestions.push({
          key: wrongKey,
          levelId: level.id,
          levelTitle: level.title,
          q: quiz.q,
          options: quiz.options,
          ans: quiz.ans,
          exp: quiz.exp
        });
      }
      saveState();
    }

    const allCorrect = level.quizzes.every((qz, idx) => currentQuizState[levelId][idx] === qz.ans);
    if (allCorrect && !playerState.passedLevels[levelId]) {
      playerState.passedLevels[levelId] = true;
      addExp(level.expReward);
      saveState();
    }

    renderApp();
    window.scrollTo(0, scrollPos);
  }

  function resetLevelQuiz(levelId) {
    currentQuizState[levelId] = {};
    window.scrollTo(0, 0);
    renderApp();
  }

  function renderWrongBook(container) {
    let html = `
      <div class="nav-bar">
        <div class="view-heading">
          <div style="margin-bottom:10px;">
            <button class="btn" onclick="goWorldMap()">⬅ 返回七大領域入口大廳</button>
          </div>
          <h1>📕 個人錯題複習本</h1>
          <p>所有在一般關卡與🔥地獄模式中答錯的比較題都會自動收錄於此，複習熟練後可點擊移出</p>
        </div>
      </div>
    `;

    if (playerState.wrongQuestions.length === 0) {
      html += `
        <div class="stage-box" style="text-align:center;padding:48px 24px;">
          <h2 style="color:var(--success);margin-bottom:10px;">🎉 目前沒有任何錯題紀錄！</h2>
          <p style="color:var(--text-dim);margin-bottom:20px;">可返回大廳挑選任一週次關卡或挑戰🔥地獄模式。</p>
          <button class="btn btn-primary" onclick="goWorldMap()">返回七大領域大廳</button>
        </div>
      `;
    } else {
      playerState.wrongQuestions.forEach((item, idx) => {
        html += `
          <div class="stage-box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
              <span class="world-badge">所屬關卡：${item.levelTitle}</span>
              <div style="display:flex;gap:8px;">
                ${item.levelId ? `<button class="btn" onclick="goStageQuiz('${item.levelId}')">⚔️ 前往該關測驗</button>` : ``}
                <button class="btn btn-success" onclick="removeWrong('${item.key}')">✅ 已熟練，移出錯題本</button>
              </div>
            </div>
            <div class="quiz-question-text">${idx + 1}. ${item.q}</div>
            <div class="opt-stack">
              ${item.options.map((opt, oIdx) => `
                <div class="opt-item ${oIdx === item.ans ? "correct" : ""}">${opt}</div>
              `).join("")}
            </div>
            <div class="exp-panel">
              <strong>💡 正確解答與觀念解析：</strong><br>${item.exp}
            </div>
          </div>
        `;
      });
    }

    container.innerHTML = html;
  }

  function removeWrong(key) {
    playerState.wrongQuestions = playerState.wrongQuestions.filter(w => w.key !== key);
    saveState();
    renderApp();
  }

  window.addEventListener("DOMContentLoaded", () => {
    loadState();
    updateHeaderUI();
    renderApp();
  });
</script>
</body>
</html>
